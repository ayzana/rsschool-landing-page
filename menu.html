    <link rel="icon" href="./favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet" />
    <title>Coffee house</title>

  <body>
    <div class="container">
      <header class="header">
        <a class="logo" href="./index.html"
          ><img
            src="./assets/images/logo.svg"
            alt="coffe house logo"
            width="100"
            height="60"
        /></a>
        <nav class="nav">
          <ul class="nav-list">
            <li class="nav-item">
              <a href="#favorite" class="nav-link">Favorite coffee</a>
            </li>
            <li class="nav-item">
              <a href="#about" class="nav-link">About</a>
            </li>
            <li class="nav-item">
              <a href="#mobile" class="nav-link">Mobile app</a>
            </li>
            <li class="nav-item">
              <a href="#contact" class="nav-link">Contact us</a>
            </li>
          </ul>
        </nav>
        <div class="header-actions">
          <div class="theme">
            <div class="theme-icon theme-light">
              <img
                src="./assets/icons/light.svg"
                alt="sun"
                width="36"
                height="36" />
            </div>
            <div class="theme-icon theme-dark">
              <img
                src="./assets/icons/dark.svg"
                alt="moon"
                width="36"
                height="36" />
            </div>
          </div>
          <a href="./menu.html" class="menu-link">
            <p>Menu</p>
            <img
              class="menu-icon"
              src="./assets/icons/coffee-cup.svg"
              alt="coffee cup"
              width="20"
              height="20" />
          </a>
        </div>
      </header>
      <main class="main">
        <section>
          <h2 class="section-title menu-title">
            Behind each of our cups <br />hides an
            <span class="title-accent"> amazing surprise</span>
          </h2>
        </section>
      </main>
