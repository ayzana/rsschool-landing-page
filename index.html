<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>Coffee house</title>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <a class="logo" href=""
          ><img
            src="./assets/images/logo.svg"
            alt="coffe house logo"
            width="100"
            height="60"
        /></a>
        <nav class="nav">
          <ul class="nav-list">
            <li class="nav-item">
              <a href="#favorite" class="nav-link">Favorite coffee</a>
            </li>
            <li class="nav-item">
              <a href="#about" class="nav-link">About</a>
            </li>
            <li class="nav-item">
              <a href="#mobile" class="nav-link">Mobile app</a>
            </li>
            <li class="nav-item">
              <a href="#contact" class="nav-link">Contact us</a>
            </li>
          </ul>
        </nav>
        <div class="header-actions">
          <div class="theme">
            <div class="theme-icon theme-light">
              <img
                src="./assets/icons/light.svg"
                alt="sun"
                width="36"
                height="36" />
            </div>
            <div class="theme-icon theme-dark">
              <img
                src="./assets/icons/dark.svg"
                alt="moon"
                width="36"
                height="36" />
            </div>
          </div>
          <a href="#" class="menu-link">
            <p>Menu</p>
            <img
              class="menu-icon"
              src="./assets/icons/coffee-cup.svg"
              alt="coffee cup"
              width="20"
              height="20" />
          </a>
        </div>
      </header>
    </div>
  </body>
</html>
